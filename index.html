<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#eae4d7" />
<title>Studio Bea Sophia — Kasse II / Score Architecture</title>
<style>
  :root {
    color-scheme: light;
    --paper: #ece5d8;
    --paper-hi: #f6f0e5;
    --paper-edge: #c5baaa;
    --paper-edge-dark: #9f9486;
    --ink: #171512;
    --soft-ink: rgba(23,21,18,.54);
    --hairline: rgba(23,21,18,.22);
    --progress: 0;
    --pointer-x: 0;
    --pointer-y: 0;
    --score-w: 520px;
    --score-h: 752px;
    --edge: 14px;
  }

  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    min-width: 320px;
    background:
      radial-gradient(1000px 650px at 50% 46%, rgba(255,255,255,.46), transparent 68%),
      linear-gradient(180deg, #f1ebdf 0%, #e8e0d2 100%);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", Times, serif;
    overscroll-behavior-y: none;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: .14;
    mix-blend-mode: multiply;
    background-image:
      radial-gradient(circle at 18% 22%, rgba(49,38,25,.38) 0 .35px, transparent .5px),
      radial-gradient(circle at 74% 63%, rgba(49,38,25,.22) 0 .45px, transparent .65px);
    background-size: 8px 8px, 11px 11px;
  }

  .scroll-track { height: 660vh; }

  .viewport {
    position: sticky;
    inset: 0 0 auto 0;
    top: 0;
    width: 100%;
    height: 100svh;
    overflow: clip;
    isolation: isolate;
  }

  .ambient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(closest-side at 50% 52%, rgba(255,255,255,.36), transparent 74%),
      linear-gradient(90deg, rgba(104,82,54,.035), transparent 20%, transparent 80%, rgba(104,82,54,.035));
    pointer-events: none;
  }

  .masthead {
    position: absolute;
    z-index: 40;
    left: clamp(18px, 3.2vw, 54px);
    top: clamp(18px, 3vw, 44px);
    display: grid;
    gap: 7px;
    pointer-events: none;
  }

  .masthead strong {
    font-size: clamp(14px, 1.12vw, 19px);
    line-height: 1;
    font-weight: 400;
    letter-spacing: -.025em;
  }

  .meta,
  .phase,
  .scroll-note {
    font: 9px/1.45 "Courier New", Courier, monospace;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--soft-ink);
  }

  .phase {
    position: absolute;
    z-index: 40;
    right: clamp(18px, 3.2vw, 54px);
    top: clamp(18px, 3vw, 44px);
    text-align: right;
    min-width: 17ch;
    pointer-events: none;
  }

  .scroll-note {
    position: absolute;
    z-index: 40;
    left: clamp(18px, 3.2vw, 54px);
    bottom: clamp(18px, 3vw, 44px);
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    transition: opacity 300ms ease;
  }

  .scroll-note::before {
    content: "";
    width: 28px;
    height: 1px;
    background: currentColor;
    transform-origin: left center;
    animation: breathe 1.8s ease-in-out infinite;
  }

  @keyframes breathe { 50% { transform: scaleX(.55); opacity: .45; } }

  .rail {
    position: absolute;
    z-index: 40;
    right: clamp(18px, 3.2vw, 54px);
    top: 50%;
    width: 1px;
    height: min(36vh, 290px);
    transform: translateY(-50%);
    background: var(--hairline);
    pointer-events: none;
  }

  .rail::after {
    content: "";
    position: absolute;
    left: -1px;
    top: 0;
    width: 3px;
    height: calc(var(--progress) * 100%);
    background: rgba(23,21,18,.62);
  }

  .rail span {
    position: absolute;
    right: 11px;
    bottom: -2px;
    transform: translateY(100%);
    font: 8px/1 "Courier New", monospace;
    letter-spacing: .09em;
    color: var(--soft-ink);
  }

  .perspective {
    position: absolute;
    inset: 0;
    perspective: clamp(950px, 86vw, 1700px);
    perspective-origin: calc(50% + var(--pointer-x) * 16px) calc(50% + var(--pointer-y) * 12px);
    display: grid;
    place-items: center;
  }

  .world {
    position: relative;
    width: var(--score-w);
    height: var(--score-h);
    transform-style: preserve-3d;
    will-change: transform;
  }

  .score-shadow {
    position: absolute;
    inset: 7% -14% -12% -14%;
    background: radial-gradient(ellipse at center, rgba(36,28,19,.30), rgba(36,28,19,.09) 48%, transparent 74%);
    filter: blur(28px);
    transform: translate3d(0, 34px, -170px) rotateX(74deg);
    opacity: .42;
    will-change: opacity, transform;
  }

  .flat,
  .ghost,
  .slice {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    transform-style: preserve-3d;
    will-change: transform, opacity;
  }

  .flat {
    height: 100%;
    overflow: hidden;
    background: var(--paper-hi);
    box-shadow:
      0 1px 0 rgba(255,255,255,.75) inset,
      0 0 0 1px rgba(58,45,31,.12),
      0 30px 70px rgba(58,45,31,.15);
  }

  .flat img,
  .ghost img,
  .front img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    pointer-events: none;
  }

  .flat img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .ghost {
    height: 100%;
    opacity: 0;
    filter: sepia(.06) contrast(1.05);
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .ghost img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .slice {
    height: var(--slice-h);
    top: var(--slice-top);
    transform-origin: 50% 50%;
  }

  .front {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #f2ebdf;
    backface-visibility: hidden;
    box-shadow: 0 2px 0 rgba(255,255,255,.35) inset;
  }

  .front img {
    position: absolute;
    left: 0;
    width: 100%;
    top: var(--image-offset);
  }

  .slice::after {
    content: "";
    position: absolute;
    left: 0;
    top: 100%;
    width: 100%;
    height: var(--edge);
    transform-origin: 50% 0;
    transform: rotateX(-90deg);
    background:
      linear-gradient(180deg, rgba(255,255,255,.22), transparent 20%),
      linear-gradient(90deg, #b6ab9a, #d0c6b6 50%, #a99d8c);
    box-shadow: 0 1px 0 rgba(38,30,22,.12) inset;
  }

  .slice::before {
    content: "";
    position: absolute;
    left: 100%;
    top: 0;
    width: var(--edge);
    height: 100%;
    transform-origin: 0 50%;
    transform: rotateY(90deg);
    background: linear-gradient(90deg, #b5aa99, #938777);
  }

  .vignette {
    position: absolute;
    z-index: 30;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(83,63,40,.05) 78%, rgba(83,63,40,.1) 100%);
  }

  .loading {
    position: absolute;
    inset: 0;
    z-index: 60;
    display: grid;
    place-items: center;
    background: var(--paper);
    transition: opacity 450ms ease, visibility 450ms ease;
  }
  .loading[hidden] { opacity: 0; visibility: hidden; display: grid; }
  .loading span {
    font: 9px/1.4 "Courier New", monospace;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--soft-ink);
  }

  @media (max-width: 700px) {
    .phase { top: auto; bottom: clamp(18px, 4vw, 28px); }
    .rail { display: none; }
    .scroll-note { bottom: clamp(18px, 4vw, 28px); }
    .phase { right: clamp(18px, 4vw, 28px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .scroll-note::before { animation: none; }
  }
</style>
<!-- standalone score-depth deployment -->
</head>
<body>
<div class="scroll-track" id="track">
  <main class="viewport" aria-label="Scroll-controlled three dimensional interpretation of the Kasse II score">
    <div class="ambient"></div>
    <header class="masthead" aria-hidden="true">
      <strong>Studio Bea Sophia</strong>
      <span class="meta">score architecture / Kasse II</span>
    </header>
    <div class="phase" id="phase" aria-live="polite">01 / surface</div>
    <div class="scroll-note" id="scrollNote" aria-hidden="true">scroll to enter the score</div>
    <div class="rail" aria-hidden="true"><span>depth</span></div>
    <div class="perspective" id="perspective">
      <section class="world" id="world" aria-hidden="true">
        <div class="score-shadow" id="shadow"></div>
        <div class="flat" id="flat"></div>
        <div id="ghosts"></div>
        <div id="slices"></div>
      </section>
    </div>
    <div class="vignette"></div>
    <div class="loading" id="loading"><span>loading score</span></div>
  </main>
</div>

  function makeImage() {
    const img = new Image();
    img.src = imageUrl;
    img.alt = '';
    img.draggable = false;
    return img;
  }

  function buildScene() {
    flat.appendChild(makeImage());

    for (let g=0; g<4; g++) {
      const ghost = document.createElement('div');
      ghost.className = 'ghost';
      ghost.appendChild(makeImage());
      ghostsEl.appendChild(ghost);
      ghostModels.push({el:ghost, i:g});
    }

    for (let i=0; i<cuts.length-1; i++) {
      const top = cuts[i];
      const bottom = cuts[i+1];
      const h = bottom-top;
      const slice = document.createElement('div');
      slice.className = 'slice';
      slice.style.setProperty('--slice-top', `${top*100}%`);
      slice.style.setProperty('--slice-h', `${h*100}%`);
      slice.style.setProperty('--image-offset', `${-(top/h)*100}%`);
      const front = document.createElement('div');
      front.className = 'front';
      front.appendChild(makeImage());
      slice.appendChild(front);
      slicesEl.appendChild(slice);
      sliceModels.push({el:slice, i, top, h, mid:(top+bottom)/2});
    }
  }

  function sizeScene() {
    const vh = innerHeight;
    const vw = innerWidth;
    const maxH = vw < 700 ? vh*.68 : vh*.76;
    const maxW = vw < 700 ? vw*.76 : vw*.49;
    const width = Math.min(maxW, maxH*(SOURCE_W/SOURCE_H));
    const height = width*(SOURCE_H/SOURCE_W);
    root.style.setProperty('--score-w', `${width}px`);
    root.style.setProperty('--score-h', `${height}px`);
    root.style.setProperty('--edge', `${clamp(width*.025, 8, 16)}px`);
  }

  function targetProgress() {
    if (Number.isFinite(debugProgress)) return clamp(debugProgress);
    const max = Math.max(1, track.offsetHeight - innerHeight);
    const rect = track.getBoundingClientRect();
    return clamp(-rect.top/max);
  }

  function setPhase(p) {
    let txt = '01 / surface';
    if (p >= .12) txt = '02 / score becomes structure';
    if (p >= .34) txt = '03 / staves become planes';
    if (p >= .58) txt = '04 / orbit';
    if (p >= .79) txt = '05 / compression';
    if (p >= .93) txt = '06 / surface again';
    phaseEl.textContent = txt;
    scrollNote.style.opacity = String(1-smooth(.02,.11,p));
  }

  function render(p) {
    root.style.setProperty('--progress', p.toFixed(4));
    setPhase(p);

    const open = reduced ? 0 : bell(p, .08, .22, .80, .95);
    const explode = reduced ? 0 : bell(p, .18, .34, .72, .91);
    const orbitA = reduced ? 0 : smooth(.10,.55,p) * (1-smooth(.84,.98,p));
    const orbitB = reduced ? 0 : smooth(.56,.72,p) * (1-smooth(.84,.97,p));
    const returnFlat = smooth(.90,.985,p);
    const introScale = mix(.93, 1.0, smooth(0,.12,p));
    const depthScale = mix(1, 1.10, bell(p,.34,.48,.73,.86));

    const rotY = (-41*orbitA + 64*orbitB) * (1-returnFlat) + pointerX*1.6*open;
    const rotX = (8*orbitA - 5*orbitB) * (1-returnFlat) - pointerY*1.25*open;
    const rotZ = (1.2*Math.sin(p*Math.PI*3))*open;
    const x = mix(0, innerWidth < 700 ? -5 : -22, bell(p,.48,.58,.77,.90));
    const y = mix(10, -8, smooth(.12,.75,p));
    world.style.transform = `translate3d(${x}px,${y}px,0) rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg) scale(${introScale*depthScale})`;

    const flatAlpha = 1 - smooth(.075,.18,p) + returnFlat;
    flat.style.opacity = String(clamp(flatAlpha));
    flat.style.transform = `translateZ(${mix(0,-8,open)}px)`;

    ghostModels.forEach(({el,i}) => {
      const stagger = i/3;
      const alpha = open * (1-returnFlat) * (.13 - i*.016);
      const gz = -48 - i*62 - explode*110*stagger;
      const gy = (i-1.5)*10*explode;
      const grY = rotY*.18 + (i-1.5)*1.8*explode;
      el.style.opacity = String(clamp(alpha));
      el.style.transform = `translate3d(0,${gy}px,${gz}px) rotateY(${grY}deg)`;
    });

    const n = sliceModels.length-1;
    sliceModels.forEach((m) => {
      const centred = (m.i/n)*2-1;
      const wave = Math.sin((m.i*1.71)+.4);
      const alt = m.i%2 ? 1 : -1;
      const envelope = open*(1-returnFlat);

      const zBase = explode * (130 + 560*(m.i/n));
      const zWave = explode * wave*52;
      const xFan = explode * centred * (innerWidth<700 ? 42 : 86);
      const xWave = explode * wave * (innerWidth<700 ? 12 : 24);
      const yFan = explode * centred * centred * alt * 28;
      const localRY = explode * centred * 8 + orbitB*centred*4;
      const localRX = explode * wave*2.6;
      const localRZ = explode * alt*centred*1.4;

      const z = envelope*(zBase+zWave);
      const sx = envelope*(xFan+xWave);
      const sy = envelope*yFan;
      m.el.style.opacity = String(clamp(smooth(.075,.16,p) * (1-returnFlat*.86)));
      m.el.style.transform = `translate3d(${sx}px,${sy}px,${z}px) rotateX(${localRX}deg) rotateY(${localRY}deg) rotateZ(${localRZ}deg)`;
      m.el.style.filter = `brightness(${mix(1, .94, explode*Math.max(0, centred))})`;
    });

    const shadow = document.getElementById('shadow');
    shadow.style.opacity = String(.22 + open*.32);
    shadow.style.transform = `translate3d(${rotY*1.2}px, ${34+explode*24}px, ${-170-explode*160}px) rotateX(74deg) scale(${1+explode*.18})`;
  }

  function loop() {
    raf = requestAnimationFrame(loop);
    scrollProgress = targetProgress();
    const follow = Number.isFinite(debugProgress) ? 1 : .13;
    visualProgress += (scrollProgress-visualProgress)*follow;
    if (Math.abs(scrollProgress-visualProgress) < .00005) visualProgress = scrollProgress;
    render(visualProgress);
  }

  function onPointer(e) {
    if (e.pointerType === 'touch') return;
    pointerX = ((e.clientX/innerWidth)-.5)*2;
    pointerY = ((e.clientY/innerHeight)-.5)*2;
    root.style.setProperty('--pointer-x', pointerX.toFixed(3));
    root.style.setProperty('--pointer-y', pointerY.toFixed(3));
  }

  function cleanup() {
    cancelAnimationFrame(raf);
    if (imageUrl.startsWith('blob:')) URL.revokeObjectURL(imageUrl);
  }

  addEventListener('resize', sizeScene, {passive:true});
  addEventListener('pointermove', onPointer, {passive:true});
  addEventListener('pagehide', cleanup, {once:true});

  loadImage()
    .then(() => {
      buildScene();
      sizeScene();
      loading.hidden = true;
      visualProgress = targetProgress();
      render(visualProgress);
      loop();
    })
    .catch(err => {
      loading.querySelector('span').textContent = 'score unavailable';
      console.error(err);
    });
})();
</script>
