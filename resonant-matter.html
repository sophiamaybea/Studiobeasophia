file.addEventListener('change',function(){if(file.files&&file.files[0])load(file.files[0])});play.addEventListener('click',async function(){try{await useAudio();if(audio.paused){stopMic();micOn=false;mic.classList.remove('on');mic.textContent='Mic';await audio.play();play.textContent='Pause';state.textContent='the score is drawing'}else{audio.pause();play.textContent='Play';state.textContent='paused / the field keeps its memory'}}catch(e){fail(e)}});audio.addEventListener('ended',function(){play.textContent='Play';state.textContent='ended / replay or load another track'});mic.addEventListener('click',async function(){try{if(!micOn){await useMic();micOn=true;mic.classList.add('on');mic.textContent='Stop mic';name.textContent='Live room';state.textContent='microphone is conducting the field'}else{stopMic();micOn=false;mic.classList.remove('on');mic.textContent='Mic';name.textContent=audio.src?'Loaded track':'Drop a track anywhere';state.textContent='microphone stopped'}}catch(e){fail(e)}});document.getElementById('clear').addEventListener('click',clear);addEventListener('keydown',function(e){if(e.code==='Space'&&!/BUTTON|INPUT/.test(document.activeElement.tagName)){e.preventDefault();if(!play.disabled)play.click()}if(e.key.toLowerCase()==='c')clear()});['dragenter','dragover'].forEach(function(k){addEventListener(k,function(e){e.preventDefault();drop.classList.add('show')})});['dragleave','drop'].forEach(function(k){addEventListener(k,function(e){e.preventDefault();drop.classList.remove('show')})});addEventListener('drop',function(e){var a=Array.from((e.dataTransfer&&e.dataTransfer.files)||[]),f=a.find(function(x){return x.type.indexOf('audio/')===0});if(f)load(f)});
var qs=new URLSearchParams(location.search);if(qs.get('embed')==='1')document.body.classList.add('embed');var src=qs.get('src');if(src){audio.src=src;audio.load();name.textContent=src.split('/').pop()||'Track';state.textContent='ready';play.disabled=false}addEventListener('beforeunload',function(){stopMic();if(url)URL.revokeObjectURL(url);if(AC&&AC.state!=='closed')AC.close()});resize();requestAnimationFrame(loop);
})();
</script></body></html>
